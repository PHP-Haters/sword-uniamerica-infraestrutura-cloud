swagger: '2.0'
info:
  title: Todo API Gateway
  description: Proxy reverso para o backend Node.js no Cloud Run
  version: 1.0.0
schemes:
  - https
produces:
  - application/json
paths:
  /health:
    get:
      summary: Check de saude do backend
      operationId: healthCheck
      x-google-backend:
        address: https://sword-backend-621023535843.us-central1.run.app/health
      security:
        - api_key: []
      responses:
        '200':
          description: OK
  /todos:
    get:
      summary: Lista todas as tarefas
      operationId: getTodos
      x-google-backend:
        address: https://sword-backend-621023535843.us-central1.run.app/todos
      security:
        - api_key: []
      responses:
        '200':
          description: OK
    post:
      summary: Cria uma nova tarefa
      operationId: createTodo
      x-google-backend:
        address: https://sword-backend-621023535843.us-central1.run.app/todos
      security:
        - api_key: []
      responses:
        '201':
          description: Criado
securityDefinitions:
  api_key:
    type: apiKey
    name: key
    in: query